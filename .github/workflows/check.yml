name: Schema check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every card and tool matches the schema
        run: python3 scripts/check.py
      - name: Valid samples pass and broken samples are rejected
        run: python3 scripts/check.py --self-test
